<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Izin Keluar Sekolah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- HTML5 QR Code -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: none; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        #reader video { object-fit: cover !important; width: 100% !important; border-radius: 12px; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col gap-6 pt-8">
        
        <div class="text-center">
            <h1 class="text-2xl font-bold text-slate-800">Scan Izin Keluar</h1>
            <p class="text-sm text-slate-500 mt-1">Arahkan QR Code Siswa ke kamera</p>
        </div>

        <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-100">
            <div id="reader"></div>
            <div class="mt-4 flex gap-2 justify-center flex-wrap">
                <button id="btnStart" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">
                    Mulai Kamera
                </button>
                <button id="btnSwitch" class="bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition hidden">
                    🔄 Ganti Kamera
                </button>
                <button id="btnStop" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-600 transition hidden">
                    Matikan Kamera
                </button>
            </div>
        </div>

        <div id="resultBox" class="hidden bg-white rounded-xl p-5 shadow-sm border border-slate-200 text-left transition-all">
            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
                <h3 class="font-bold text-slate-700">Daftar Izin Keluar</h3>
                <span id="kuotaBadge" class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full">Sisa Kuota: -</span>
            </div>
            <ul id="listSiswaKeluar" class="space-y-3"></ul>
        </div>

    </main>

    <script>
        // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxmmxJ2ULhChu4K3XCoKY0gRZlLidrj2Pygbkc_yMtB0FmH_3IJsbc0mNGKDtwBd4C4iQ/exec'; 
        
        let isScanning = false;
        let html5QrCode;
        let currentFacingMode = "environment";
        
        const resultBox = document.getElementById('resultBox');
        const listSiswaKeluar = document.getElementById('listSiswaKeluar');
        const kuotaBadge = document.getElementById('kuotaBadge');
        const btnStart = document.getElementById('btnStart');
        const btnSwitch = document.getElementById('btnSwitch');
        const btnStop = document.getElementById('btnStop');

        // PEMBERSIH FORMAT WAKTU
        function formatWaktu(jamString) {
            if (!jamString) return "-";
            if (jamString.includes('T')) {
                return jamString.split('T')[1].substring(0, 8); // Ambil hanya HH:mm:ss
            }
            return jamString;
        }

        // FUNGSI RENDER DAFTAR SISWA
        function renderListKeluar(listKeluar, sisaKuota) {
            listSiswaKeluar.innerHTML = '';
            if (listKeluar && listKeluar.length > 0) {
                listKeluar.forEach(siswa => {
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-200";
                    li.innerHTML = `
                        <div>
                            <p class="font-bold text-slate-700 text-sm">${siswa.nama}</p>
                            <p class="text-xs text-slate-500">Kelas: ${siswa.kelas}</p>
                        </div>
                        <span class="text-xs font-semibold text-amber-600 bg-amber-50 px-2 py-1 rounded">Keluar: ${formatWaktu(siswa.jam)}</span>
                    `;
                    listSiswaKeluar.appendChild(li);
                });
            } else {
                listSiswaKeluar.innerHTML = '<li class="text-center text-sm text-slate-400 py-4">Semua siswa sudah berada di sekolah.</li>';
            }
            kuotaBadge.textContent = `Sisa Kuota: ${sisaKuota}`;
            resultBox.classList.remove('hidden');
        }

        // AUTO-LOAD SAAT HALAMAN DIBUKA (MENCEGAH DAFTAR HILANG SAAT RELOAD)
        document.addEventListener("DOMContentLoaded", () => {
            const payload = JSON.stringify({ action: 'init' });
            const urlWithParams = SCRIPT_URL + "?data=" + encodeURIComponent(payload);
            
            fetch(urlWithParams, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(data => {
                if(data.status) renderListKeluar(data.listKeluar, data.sisaKuota);
            })
            .catch(err => console.error("Gagal load data awal: ", err));

            setTimeout(startCamera, 500);
        });

        function startCamera() {
            if (!html5QrCode) { html5QrCode = new Html5Qrcode("reader"); }
            
            html5QrCode.start(
                { facingMode: currentFacingMode },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess,
                (errorMessage) => {}
            ).then(() => {
                btnStart.classList.add('hidden');
                btnSwitch.classList.remove('hidden');
                btnStop.classList.remove('hidden');
            }).catch((err) => {
                console.log(err);
            });
        }

        function stopCamera() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    btnStart.classList.remove('hidden');
                    btnSwitch.classList.add('hidden');
                    btnStop.classList.add('hidden');
                }).catch((err) => {});
            }
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    startCamera();
                }).catch(() => startCamera());
            }
        }

        btnStart.addEventListener('click', startCamera);
        btnStop.addEventListener('click', stopCamera);
        btnSwitch.addEventListener('click', switchCamera);

        // LOGIKA SCAN
        function onScanSuccess(decodedText, decodedResult) {
            if (isScanning) return;
            
            isScanning = true;
            stopCamera(); 
            
            Swal.fire({
                title: 'Memproses Data...',
                text: 'Menghubungkan ke Server...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });
            
            const nisnBersih = decodedText.trim();
            const payload = JSON.stringify({ action: 'scan', qrText: nisnBersih });
            const urlWithParams = SCRIPT_URL + "?data=" + encodeURIComponent(payload);

            fetch(urlWithParams, { method: 'GET', redirect: 'follow' })
            .then(response => {
                if (!response.ok) throw new Error("HTTP Status: " + response.status);
                return response.json();
            })
            .then(data => {
                if (data.status) {
                    Swal.fire({
                        icon: 'success',
                        title: data.tipe === 'keluar' ? 'Diizinkan Keluar' : 'Siswa Kembali',
                        text: data.data,
                        timer: 2000,
                        showConfirmButton: false
                    });

                    renderListKeluar(data.listKeluar, data.sisaKuota);

                } else {
                    Swal.fire({ icon: 'error', title: 'Gagal', text: data.message });
                }
            })
            .catch(error => {
                Swal.fire('Error', 'Gagal memproses data.', 'error');
            })
            .finally(() => {
                setTimeout(() => {
                    isScanning = false;
                    startCamera();
                }, 2500);
            });
        }
    </script>
</body>
</html>
