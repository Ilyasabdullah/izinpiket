<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Izin Keluar Sekolah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- HTML5 QR Code -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: none; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        #reader video { object-fit: cover !important; width: 100% !important; border-radius: 12px; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col gap-6 pt-8">
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-2xl font-bold text-slate-800">Scan Izin Keluar</h1>
            <p class="text-sm text-slate-500 mt-1">Arahkan QR Code Siswa ke kamera</p>
        </div>

        <!-- Scanner Box -->
        <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-100">
            <div id="reader"></div>
            <!-- Tombol Kamera Manual -->
            <div class="mt-4 flex gap-2 justify-center">
                <button id="btnStart" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">
                    Mulai Kamera
                </button>
                <button id="btnStop" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-600 transition hidden">
                    Matikan Kamera
                </button>
            </div>
        </div>

        <!-- Result Box -->
        <div id="resultBox" class="hidden bg-white rounded-xl p-5 shadow-sm border border-slate-200 text-center transition-all">
            <div id="statusBadge" class="inline-block px-3 py-1 text-xs font-semibold rounded-full mb-3"></div>
            <h2 id="studentInfo" class="text-xl font-bold text-slate-700">-</h2>
            <p id="timeInfo" class="text-sm text-slate-500 mt-2">-</p>
        </div>

    </main>

    <script>
        // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxmmxJ2ULhChu4K3XCoKY0gRZlLidrj2Pygbkc_yMtB0FmH_3IJsbc0mNGKDtwBd4C4iQ/exec'; 
        
        let isScanning = false;
        let html5QrCode;
        
        const resultBox = document.getElementById('resultBox');
        const studentInfo = document.getElementById('studentInfo');
        const statusBadge = document.getElementById('statusBadge');
        const timeInfo = document.getElementById('timeInfo');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');

        // Fungsi Memulai Kamera
        function startCamera() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            html5QrCode.start(
                { facingMode: "environment" }, // Kamera belakang
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess,
                (errorMessage) => { /* Abaikan error mencari frame */ }
            ).then(() => {
                btnStart.classList.add('hidden');
                btnStop.classList.remove('hidden');
            }).catch((err) => {
                Swal.fire('Kamera Error', 'Izinkan akses kamera di browser Anda.', 'error');
            });
        }

        // Fungsi Menghentikan Kamera Tanpa Error
        function stopCamera() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    btnStart.classList.remove('hidden');
                    btnStop.classList.add('hidden');
                }).catch((err) => {
                    console.log("Kamera sudah berhenti.");
                });
            }
        }

        // Event Listeners Tombol
        btnStart.addEventListener('click', startCamera);
        btnStop.addEventListener('click', stopCamera);

        // Auto-start saat halaman dimuat
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(startCamera, 500); // Jeda sedikit agar elemen 'reader' siap
        });

        // Logika saat Scan Berhasil
        function onScanSuccess(decodedText, decodedResult) {
            if (isScanning) return;
            
            isScanning = true;
            stopCamera(); // Hentikan kamera sementara agar tidak scan berulang
            
            Swal.fire({
                title: 'Memproses Data...',
                text: 'Mengecek kuota dan status siswa',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });
            
            const nisnBersih = decodedText.trim();
            const payload = JSON.stringify({ action: 'scan', qrText: nisnBersih });
            const urlWithParams = SCRIPT_URL + "?data=" + encodeURIComponent(payload);

            fetch(urlWithParams, { method: 'GET', redirect: 'follow' })
            .then(response => {
                if (!response.ok) throw new Error("HTTP Status: " + response.status);
                return response.json();
            })
            .then(data => {
                if (data.status) {
                    Swal.fire({
                        icon: 'success',
                        title: data.tipe === 'keluar' ? 'Diizinkan Keluar' : 'Berhasil Kembali',
                        text: `${data.data} (Sisa Kuota: ${data.sisaKuota})`,
                        timer: 2000,
                        showConfirmButton: false
                    });

                    studentInfo.textContent = data.data;
                    timeInfo.textContent = `Waktu Scan: ${new Date().toLocaleTimeString('id-ID')}`;
                    
                    if (data.tipe === 'keluar') {
                        statusBadge.textContent = "IZIN KELUAR";
                        statusBadge.className = "inline-block px-3 py-1 text-xs font-semibold rounded-full mb-3 bg-amber-100 text-amber-700";
                    } else {
                        statusBadge.textContent = "KEMBALI KE SEKOLAH";
                        statusBadge.className = "inline-block px-3 py-1 text-xs font-semibold rounded-full mb-3 bg-emerald-100 text-emerald-700";
                    }
                    resultBox.classList.remove('hidden');

                } else {
                    Swal.fire({ icon: 'error', title: 'Gagal', text: data.message });
                }
            })
            .catch(error => {
                Swal.fire('Error', 'Gagal memproses data.', 'error');
            })
            .finally(() => {
                setTimeout(() => {
                    isScanning = false;
                    startCamera(); // Nyalakan kamera lagi
                }, 2500);
            });
        }
    </script>
</body>
</html>
